services:
  app:
    image: ghcr.io/mealie-recipes/mealie
    restart: unless-stopped
    environment:
      - ALLOW_SIGNUP=false
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - BASE_URL
      - DB_ENGINE=postgres
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD=mealie
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_TYPE=${CADDY_TYPE:-external}
      - CADDY_PORT=${CADDY_PORT:-9000}
    volumes:
      - app_data:/app/data/
    networks:
      - caddy
      - default
    depends_on:
      - db

  db:
    image: pgautoupgrade/pgautoupgrade:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD=mealie
      - POSTGRES_DB=mealie
    volumes:
      - db_data:/var/lib/postgresql
    labels:
      ofelia.restart: "true"
      ofelia.enabled: "true"
      ofelia.job-exec.mealiedbbackup.schedule: "0 0 1 * * *"
      ofelia.job-exec.mealiedbbackup.command: "sh -c 'pg_dumpall -U mealie -f /var/lib/postgresql/backup.sql'"
    networks:
      default:

volumes:
  app_data:
  db_data:

networks:
  caddy:
  default:
